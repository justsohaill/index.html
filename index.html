<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospect Research Tool</title>
  <style>
    :root {
      --bg: #f8f9fb;
      --bg-card: #ffffff;
      --bg-input: #f1f3f7;
      --bg-section: #f8f9fb;
      --text: #1a1d23;
      --text-secondary: #5f6672;
      --text-muted: #8b919d;
      --border: #e2e5eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff4ff;
      --accent-text: #ffffff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --tag-bg: #e8edf5;
      --tag-text: #3b4a6b;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #991b1b;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
      --radius: 10px;
      --radius-sm: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1117;
        --bg-card: #1a1d27;
        --bg-input: #252833;
        --bg-section: #1e2130;
        --text: #e8eaf0;
        --text-secondary: #a0a6b4;
        --text-muted: #6b7280;
        --border: #2d3140;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-light: #1e293b;
        --accent-text: #ffffff;
        --success: #22c55e;
        --success-bg: #0a1f15;
        --warning: #f59e0b;
        --warning-bg: #1a1505;
        --tag-bg: #2d3140;
        --tag-text: #a0b4d4;
        --error-bg: #2d1b1b;
        --error-border: #5c2020;
        --error-text: #fca5a5;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1117;
      --bg-card: #1a1d27;
      --bg-input: #252833;
      --bg-section: #1e2130;
      --text: #e8eaf0;
      --text-secondary: #a0a6b4;
      --text-muted: #6b7280;
      --border: #2d3140;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #1e293b;
      --accent-text: #ffffff;
      --success: #22c55e;
      --success-bg: #0a1f15;
      --warning: #f59e0b;
      --warning-bg: #1a1505;
      --tag-bg: #2d3140;
      --tag-text: #a0b4d4;
      --error-bg: #2d1b1b;
      --error-border: #5c2020;
      --error-text: #fca5a5;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      text-align: center;
      padding: 40px 16px 32px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 15px;
      max-width: 520px;
      margin: 0 auto;
    }

    .input-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow-md);
      margin-bottom: 32px;
    }

    .settings-panel {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .settings-panel summary {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .settings-panel[open] summary {
      margin-bottom: 12px;
    }

    .settings-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
    }

    @media (max-width: 640px) {
      .settings-row { grid-template-columns: 1fr; }
    }

    .api-key-group {
      display: flex;
      gap: 8px;
    }

    .api-key-group input { flex: 1; }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .input-row { grid-template-columns: 1fr; }
    }

    .field { margin-bottom: 0; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input, .field select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .field input::placeholder, .field textarea::placeholder {
      color: var(--text-muted);
    }

    .field textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .field-help {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border); }

    .btn-sm {
      padding: 8px 14px;
      font-size: 13px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .spinner-lg {
      width: 28px;
      height: 28px;
      border-width: 3px;
      border-color: var(--border);
      border-top-color: var(--accent);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 28px;
      box-shadow: var(--shadow-md);
      text-align: center;
      margin-bottom: 32px;
    }

    .loading-card .spinner-lg {
      margin: 0 auto 16px;
    }

    .loading-status {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .loading-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .error-box {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .brief-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brief-header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brief-header .meta {
      font-size: 13px;
      color: var(--text-muted);
    }

    .brief-actions {
      display: flex;
      gap: 8px;
    }

    .brief-actions .btn {
      padding: 8px 16px;
      font-size: 13px;
    }

    .brief-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .brief-grid { grid-template-columns: 1fr; }
    }

    .brief-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .brief-section.full-width {
      grid-column: 1 / -1;
    }

    .brief-section h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .profile-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 700;
    }

    .profile-title {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .profile-summary {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      line-height: 1.6;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }

    .info-item { padding: 6px 0; }

    .info-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .info-value {
      font-size: 14px;
      color: var(--text);
      word-break: break-word;
    }

    .info-value a {
      color: var(--accent);
      text-decoration: none;
    }

    .info-value a:hover { text-decoration: underline; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      display: inline-block;
      padding: 3px 10px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .talking-point {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .talking-point:last-child { border-bottom: none; }

    .talking-point strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .talking-point p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .score-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .score-track {
      flex: 1;
      height: 6px;
      background: var(--bg-input);
      border-radius: 3px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    .score-label {
      font-size: 13px;
      font-weight: 600;
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .score-item { margin-bottom: 12px; }
    .score-item:last-child { margin-bottom: 0; }

    .score-name {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .editable {
      outline: none;
      border-radius: 3px;
      transition: background 0.15s;
      padding: 1px 3px;
      margin: -1px -3px;
    }

    .editable:hover { background: var(--accent-light); }
    .editable:focus { background: var(--accent-light); }

    .tech-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tech-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-section);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .tech-tag .tech-cat {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .tech-tag.detected {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .tech-tag.detected .tech-cat {
      color: var(--accent);
    }

    .pain-card {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .pain-card:last-child { border-bottom: none; }

    .pain-card strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .pain-card p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .news-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .news-item:last-child { border-bottom: none; }

    .news-date {
      flex-shrink: 0;
      width: 56px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: right;
      padding-top: 2px;
    }

    .news-body strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .news-body p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .news-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
      vertical-align: middle;
    }

    .news-tag.funding { background: #dbeafe; color: #1d4ed8; }
    .news-tag.hiring { background: #d1fae5; color: #047857; }
    .news-tag.product { background: #fef3c7; color: #92400e; }
    .news-tag.press { background: #ede9fe; color: #6d28d9; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .news-tag.funding { background: #1e3a5f; color: #93c5fd; }
      :root:not([data-theme="light"]) .news-tag.hiring { background: #064e3b; color: #6ee7b7; }
      :root:not([data-theme="light"]) .news-tag.product { background: #451a03; color: #fcd34d; }
      :root:not([data-theme="light"]) .news-tag.press { background: #312e81; color: #c4b5fd; }
    }
    :root[data-theme="dark"] .news-tag.funding { background: #1e3a5f; color: #93c5fd; }
    :root[data-theme="dark"] .news-tag.hiring { background: #064e3b; color: #6ee7b7; }
    :root[data-theme="dark"] .news-tag.product { background: #451a03; color: #fcd34d; }
    :root[data-theme="dark"] .news-tag.press { background: #312e81; color: #c4b5fd; }

    .outreach-card {
      background: var(--bg-section);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 12px;
    }

    .outreach-card .outreach-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .outreach-card .outreach-body {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-line;
    }

    .outreach-card .outreach-body .highlight {
      background: var(--accent-light);
      border-bottom: 2px solid var(--accent);
      padding: 0 2px;
    }

    .angle-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .angle-row:last-child { border-bottom: none; }

    .angle-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      margin-top: 2px;
    }

    .angle-content strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .angle-content p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .source-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .source-badge.ok {
      background: var(--success-bg);
      color: var(--success);
    }

    .source-badge.warn {
      background: var(--warning-bg);
      color: var(--warning);
    }

    @media print {
      body { background: #fff; color: #000; font-size: 11px; }
      .input-card, header p, .brief-actions, .btn-row { display: none !important; }
      header { padding: 16px 0 8px; }
      header h1 { font-size: 18px; }
      .container { max-width: 100%; padding: 0 20px; }
      .brief-section { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; padding: 12px; }
      .brief-grid { gap: 8px; }
      .editable:hover, .editable:focus { background: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Prospect Research Tool</h1>
      <p>Paste a LinkedIn profile and company website to generate a real, AI-powered research brief using Claude.</p>
    </header>

    <div class="input-card">
      <details id="settingsPanel" class="settings-panel">
        <summary>API Settings</summary>
        <div class="settings-row">
          <div class="field">
            <label for="apiKey">Anthropic API Key</label>
            <div class="api-key-group">
              <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off" spellcheck="false" />
              <button class="btn btn-secondary btn-sm" id="toggleKey" onclick="toggleKeyVisibility()">Show</button>
            </div>
            <div class="field-help">Stored in your browser only. Sent only to api.anthropic.com.</div>
          </div>
          <div class="field">
            <label for="model">Model</label>
            <select id="model">
              <option value="claude-sonnet-4-20250514">Sonnet 4 (Recommended)</option>
              <option value="claude-haiku-3-5-20241022">Haiku 3.5 (Faster)</option>
            </select>
          </div>
        </div>
      </details>

      <div class="input-row">
        <div class="field">
          <label for="company">Company Website URL</label>
          <input type="url" id="company" placeholder="https://acme.com" />
        </div>
        <div class="field">
          <label for="linkedinUrl">LinkedIn Profile URL <span style="font-weight:400;text-transform:none">(optional)</span></label>
          <input type="url" id="linkedinUrl" placeholder="https://linkedin.com/in/johndoe" />
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="linkedinText">LinkedIn Profile Text</label>
        <textarea id="linkedinText" rows="8" placeholder="Go to the prospect's LinkedIn profile, select all the text on the page (Ctrl+A / Cmd+A), copy it, and paste it here.

This should include their name, headline, about section, experience, education, skills, etc."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="generateBtn" onclick="generateBrief()">
          Generate Research Brief
        </button>
        <button class="btn btn-secondary" id="clearBtn" onclick="clearAll()" style="display:none">
          Clear
        </button>
      </div>
    </div>

    <div id="error" style="display:none"></div>
    <div id="loading" class="loading-card" style="display:none">
      <div class="spinner spinner-lg"></div>
      <div class="loading-status" id="loadingStatus">Preparing...</div>
      <div class="loading-sub" id="loadingSub"></div>
    </div>
    <div id="brief" style="display:none"></div>
  </div>

  <script>
    const API_URL = 'https://api.anthropic.com/v1/messages';

    function init() {
      try {
        const savedKey = localStorage.getItem('prospect_tool_api_key') || '';
        const savedModel = localStorage.getItem('prospect_tool_model') || 'claude-sonnet-4-20250514';
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('model').value = savedModel;
        if (savedKey) {
          document.getElementById('settingsPanel').removeAttribute('open');
        } else {
          document.getElementById('settingsPanel').setAttribute('open', '');
        }
      } catch (e) {}

      document.getElementById('apiKey').addEventListener('input', function() {

    function toggleKeyVisibility() {
      const input = document.getElementById('apiKey');

      const el = document.getElementById('error');

      document.getElementById('error').style.display = 'none';

    function setLoading(visible, status, sub) {
      const el = document.getElementById('loading');
      el.style.display = visible ? 'block' : 'none';
      if (status) document.getElementById('loadingStatus').textContent = status;
      if (sub !== undefined) document.getElementById('loadingSub').textContent = sub;
    }

    function extractWebsiteData(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');

      const metas = Array.from(doc.querySelectorAll('meta')).map(m => {
        const name = m.getAttribute('name') || m.getAttribute('property') || '';
        const content = m.getAttribute('content') || '';
        return name && content ? name + ': ' + content : null;
      }).filter(Boolean).slice(0, 40);

      const scripts = Array.from(doc.querySelectorAll('script[src]'))
        .map(s => s.getAttribute('src'))
        .filter(Boolean).slice(0, 60);

      const links = Array.from(doc.querySelectorAll('link[href]')).map(l => {
        const rel = l.getAttribute('rel') || '';
        const href = l.getAttribute('href') || '';
        return rel + ': ' + href;
      }).slice(0, 30);

      doc.querySelectorAll('script, style, noscript, svg').forEach(el => el.remove());
      const textContent = (doc.body ? doc.body.textContent : '')
        .replace(/\s+/g, ' ').trim().substring(0, 25000);

      return {
        title: doc.title || '',
        metas,
        scripts,
        links,
        textContent
      };
    }

    function parseCompanyDomain(url) {
      try {
        const u = new URL(url.startsWith('http') ? url : 'https://' + url);
        return u.hostname.replace(/^www\./, '');
      } catch {
        return url;
      }
    }

    function buildPrompt(websiteData, linkedinText, companyUrl, linkedinUrl) {
      const domain = parseCompanyDomain(companyUrl);
      let prompt = '';

      if (websiteData) {
        prompt += '## Company Website: ' + domain + '\n\n';
        prompt += 'Page Title: ' + websiteData.title + '\n\n';
        if (websiteData.metas.length) {
          prompt += 'Meta Tags:\n' + websiteData.metas.join('\n') + '\n\n';
        }
        if (websiteData.scripts.length) {
          prompt += 'Script Sources (for tech stack detection):\n' + websiteData.scripts.join('\n') + '\n\n';
        }
        if (websiteData.links.length) {
          prompt += 'Link Elements:\n' + websiteData.links.join('\n') + '\n\n';
        }
        prompt += 'Page Text Content:\n' + websiteData.textContent + '\n\n';
      } else {
        prompt += '## Company Website: ' + domain + '\n\n';
        prompt += 'Note: The website could not be fetched directly. Please use your knowledge about this company based on the domain "' + domain + '" to fill in company details. Infer industry, size, tech stack, and other details from what you know about this company. If the domain is unfamiliar, make reasonable inferences from the domain name itself.\n\n';
      }

      if (linkedinText) {
        prompt += '## LinkedIn Profile Text:\n\n' + linkedinText + '\n\n';
      } else {
        prompt += '## LinkedIn Profile Text:\n\nNo LinkedIn profile text provided. Focus the brief on the company analysis and generate prospect-agnostic insights.\n\n';
      }

      if (linkedinUrl) {
        prompt += '## LinkedIn URL: ' + linkedinUrl + '\n\n';
      }

      prompt += 'Please analyze this prospect and their company, then generate a comprehensive research brief.';
      return prompt;
    }

    const SYSTEM_PROMPT = `You are an expert B2B sales researcher. Analyze the provided company website data and LinkedIn profile to generate a comprehensive prospect research brief.

Return ONLY valid JSON (no markdown fences, no explanation before or after) matching this structure:

{
  "prospect": {

  },

  ],

  ],

  ],
  "news": [
    {"title": "Headline", "desc": "Brief description", "type": "funding|hiring|product|press", "dateLabel": "approximate date or Recent"}
  ],
  "outreach": {
    "hooks": [
      {"title": "Hook approach name", "desc": "Detailed description of the approach"}
    ],
    "subjectLine": "Email subject line",
    "messageTemplate": "Full draft outreach message. Use **double asterisks** around phrases that are personalization anchors the user should customize."
  },
  "fitScores": {
    "fitScore": 75,
    "urgencyScore": 65,
    "accessibilityScore": 70
  }
}

Guidelines:
- Use REAL information extracted from the provided data. Do not invent specific funding amounts, dates, or facts you cannot verify from the inputs.
- techStack: Identify technologies from script sources, meta tags, link elements, and page text. "detected": true for technologies found in the website HTML, false for reasonable inferences based on company type.
- painPoints: 4-5 pain points. Be specific to this person's actual role and seniority, not generic. Reference their real company and industry.
- talkingPoints: 3 points grounded in real information from the profile and website.
- news: Include signals you can identify from the data (hiring indicators, product launches, growth signals). Use "type" to categorize. If speculating, make the title clear about that.
- outreach hooks: 3-4 approaches ranked by likely effectiveness. Reference real details about the prospect.
- messageTemplate: A ready-to-customize outreach message. Surround key personalization points with **double asterisks**.
- fitScores: Your honest assessment. fitScore = how well they match a typical B2B buyer profile. urgencyScore = likelihood they're actively evaluating solutions. accessibilityScore = how reachable they appear.
- If something is genuinely unknown, say so rather than fabricating.`;

    async function callClaudeAPI(apiKey, model, userPrompt) {
      const resp = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: model,
          max_tokens: 4096,
          system: SYSTEM_PROMPT,
          messages: [{ role: 'user', content: userPrompt }]
        })
      });

      if (!resp.ok) {
        const body = await resp.text().catch(() => '');
        if (resp.status === 401) throw new Error('Invalid API key. Check your Anthropic API key in the settings above.');
        if (resp.status === 429) throw new Error('Rate limited. Wait a moment and try again.');
        if (resp.status === 400) {
          const msg = body.includes('credit') ? 'Your API account may be out of credits.' : 'Bad request: ' + body.substring(0, 200);
          throw new Error(msg);
        }
        throw new Error('API error (' + resp.status + '): ' + body.substring(0, 200));
      }

      const data = await resp.json();
      const text = data.content && data.content[0] && data.content[0].text;
      if (!text) throw new Error('Empty response from Claude API.');
      return text;
    }

    function parseJSON(text) {
      try { return JSON.parse(text); } catch {}
      const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (fenced) {
        try { return JSON.parse(fenced[1]); } catch {}
      }
      const start = text.indexOf('{');
      const end = text.lastIndexOf('}');
      if (start !== -1 && end > start) {
        try { return JSON.parse(text.substring(start, end + 1)); } catch {}
      }
      throw new Error('Could not parse the AI response. Try again.');
    }

    function getInitials(name) {
      return name.split(/\s+/).map(w => w[0]).join('').substring(0, 2).toUpperCase() || '?';
    }

    function scoreColor(score) {
      if (score >= 80) return 'var(--success)';
      if (score >= 60) return 'var(--accent)';
      return 'var(--warning)';
    }

    function formatTemplate(text) {
      return (text || '')
        .replace(/\*\*(.*?)\*\*/g, '<span class="highlight">$1</span>');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function generateBrief() {
      hideError();
      const apiKey = document.getElementById('apiKey').value.trim();
      const companyUrl = document.getElementById('company').value.trim();
      const linkedinText = document.getElementById('linkedinText').value.trim();
      const linkedinUrl = document.getElementById('linkedinUrl').value.trim();
      const model = document.getElementById('model').value;

      if (!apiKey) {
        showError('Please enter your Anthropic API key. Open <strong>API Settings</strong> above.');
        document.getElementById('settingsPanel').setAttribute('open', '');
        return;
      }
      if (!companyUrl && !linkedinText) {
        showError('Please enter a company website URL and/or paste LinkedIn profile text.');
        return;
      }

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      document.getElementById('brief').style.display = 'none';

      let websiteData = null;
      let websiteFetched = false;
      const fullUrl = companyUrl.startsWith('http') ? companyUrl : 'https://' + companyUrl;

      setLoading(true, 'Fetching company website...', parseCompanyDomain(companyUrl));

      try {
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(fullUrl);
        const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(12000) });
        if (resp.ok) {
          const html = (await resp.text()).substring(0, 200000);
          websiteData = extractWebsiteData(html);
          websiteFetched = true;
        }
      } catch (e) {
        websiteFetched = false;
      }

      setLoading(true,
        'Analyzing with Claude AI...',
        websiteFetched
          ? 'Website fetched successfully. Sending to Claude for analysis.'
          : 'Website couldn\'t be fetched. Claude will use its knowledge of this company.'
      );

      try {
        const userPrompt = buildPrompt(websiteData, linkedinText, companyUrl, linkedinUrl);
        const responseText = await callClaudeAPI(apiKey, model, userPrompt);
        const d = parseJSON(responseText);

        d._websiteFetched = websiteFetched;
        d._companyDomain = parseCompanyDomain(companyUrl);
        d._companyUrl = companyUrl.startsWith('http') ? companyUrl : 'https://' + companyUrl;
        d._linkedinUrl = linkedinUrl;
        d._date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

        window._briefData = d;

        setLoading(false);
        renderBrief(d);
      } catch (e) {
        setLoading(false);
        showError(e.message);
      }

      btn.disabled = false;
      btn.innerHTML = 'Generate Research Brief';
    }

    function generateMarkdown(d) {

      const bar = (score) => {

        const filled = Math.round(v / 10);
        return '█'.repeat(filled) + '░'.repeat(10 - filled) + ' ' + v + '%';

      const stripBold = (s) => (s || '').replace(/\*\*(.*?)\*\*/g, '**$1**');
      const linkedinSlug = d._linkedinUrl ? d._linkedinUrl.replace(/.*linkedin\.com\/in\//, '').replace(/[/?#].*/, '') : '';

      const lines = [
        '# ' + (p.fullName || 'Prospect'),
        '',
        '> **' + (p.title || '') + '** at **' + (c.name || '') + '**',
        '> Generated ' + d._date + ' | AI-powered analysis via Claude',
        '',
        '---',
        '',
        '## Prospect Profile',
        '',
        '| Field | Detail |',
        '|-------|--------|',
        '| **Name** | ' + (p.fullName || '') + ' |',
        '| **Title** | ' + (p.title || '') + ' |',
        '| **Company** | ' + (c.name || '') + ' |',
        '| **Location** | ' + (p.location || '') + ' |',
        '| **Years in Role** | ' + (p.yearsInRole || '') + ' |',
        '| **Total Experience** | ' + (p.totalExperience || '') + ' |',
      ];

      if (d._linkedinUrl) {
        lines.push('| **LinkedIn** | [linkedin.com/in/' + linkedinSlug + '](' + d._linkedinUrl + ') |');
      }

      if (p.summary) {
        lines.push('', '*' + p.summary + '*');
      }

      lines.push('', '---', '', '## Company Overview', '',
        '| Field | Detail |',
        '|-------|--------|',
        '| **Company** | ' + (c.name || '') + ' |',
        '| **Website** | [' + (d._companyDomain || '') + '](' + (d._companyUrl || '') + ') |',
        '| **Industry** | ' + (c.industry || '') + ' |',
        '| **Size** | ' + (c.size || '') + ' |',
        '| **Revenue** | ' + (c.revenue || '') + ' |',
        '| **Stage** | ' + (c.stage || '') + ' |',
        '| **Founded** | ' + (c.founded || '') + ' |'
      );

      if (c.description) {
        lines.push('', '*' + c.description + '*');
      }

      lines.push('', '---', '', '## Fit Scores', '',
        '| Metric | Score |',
        '|--------|-------|',
        '| ICP Fit | ' + bar(scores.fitScore) + ' |',
        '| Buying Urgency | ' + bar(scores.urgencyScore) + ' |',
        '| Accessibility | ' + bar(scores.accessibilityScore) + ' |'
      );

      lines.push('', '---', '', '## Key Talking Points', '');
      (d.talkingPoints || []).forEach(tp => {
        lines.push('### ' + tp.title, '', tp.desc, '');
      });

      lines.push('---', '', '## Role & Industry Pain Points', '');
      (d.painPoints || []).forEach(pp => {
        lines.push('### ' + pp.name, '', pp.desc, '');
      });

      lines.push('---', '', '## Tech Stack',
        '*Source: ' + (d._companyDomain || '') + (d._websiteFetched ? ' (detected)' : ' (inferred)') + '*', '',
        '| Technology | Category | Source |',
        '|------------|----------|--------|'
      );
      (d.techStack || []).forEach(t => {
        lines.push('| ' + t.name + ' | ' + t.cat + ' | ' + (t.detected ? 'Detected' : 'Inferred') + ' |');
      });

      lines.push('', '---', '', '## Signals & Intelligence', '');
      (d.news || []).forEach(n => {
        lines.push('- **[' + (n.dateLabel || '') + ']** ' + n.title + ' `' + (n.type || '') + '`');
        lines.push('  ' + n.desc);
      });

      lines.push('', '---', '', '## Personalized Outreach', '', '### Recommended Hooks', '');
      (d.outreach && d.outreach.hooks || []).forEach((h, i) => {
        lines.push('**' + (i + 1) + '. ' + h.title + '**', '', h.desc, '');
      });

      lines.push('### Draft Message', '',
        '**Subject:** ' + (d.outreach && d.outreach.subjectLine || ''), '', '---', ''
      );

      const msgPlain = stripBold(d.outreach && d.outreach.messageTemplate || '');
      lines.push(msgPlain);

      lines.push('', '---', '', '## Research Checklist', '',
        '- [ ] Review their recent LinkedIn posts and activity',
        '- [ ] Check for mutual connections for a warm intro',
        '- [ ] Look up recent company press releases',
        '- [ ] Review their conference talks or published articles',
        '- [ ] Check Glassdoor for culture and hiring signals',
        '- [ ] Research competitors and positioning',
        '', '---', '', '## Notes', '', '_Add your notes here..._', ''
      );

      return lines.join('\n');
    }

    function saveMarkdown() {
      const d = window._briefData;
      if (!d) return;

      const md = generateMarkdown(d);
      const slug = (d.prospect && d.prospect.fullName || 'prospect')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
      const filename = 'briefs/' + slug + '.md';

      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const btn = document.getElementById('savemdBtn');
      const orig = btn.innerHTML;
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Saved!';
      setTimeout(() => { btn.innerHTML = orig; }, 2000);
    }

    function copyBrief() {
      const brief = document.getElementById('brief');
      navigator.clipboard.writeText(brief.innerText).then(() => {
        const btns = document.querySelectorAll('.brief-actions .btn');
        const btn = btns[1];
        const orig = btn.innerHTML;
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Copied!';
        setTimeout(() => { btn.innerHTML = orig; }, 2000);
      });
    }

    function clearAll() {
      document.getElementById('company').value = '';
      document.getElementById('linkedinUrl').value = '';
      document.getElementById('linkedinText').value = '';
      document.getElementById('brief').style.display = 'none';
      document.getElementById('brief').innerHTML = '';
      document.getElementById('clearBtn').style.display = 'none';
      hideError();
    }

    init();
  </script>
</body>
</html>
