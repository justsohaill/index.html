<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospect Research Tool</title>
  <style>
    :root {
      --bg: #f8f9fb;
      --bg-card: #ffffff;
      --bg-input: #f1f3f7;
      --bg-section: #f8f9fb;
      --text: #1a1d23;
      --text-secondary: #5f6672;
      --text-muted: #8b919d;
      --border: #e2e5eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff4ff;
      --accent-text: #ffffff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --tag-bg: #e8edf5;
      --tag-text: #3b4a6b;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
      --radius: 10px;
      --radius-sm: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1117;
        --bg-card: #1a1d27;
        --bg-input: #252833;
        --bg-section: #1e2130;
        --text: #e8eaf0;
        --text-secondary: #a0a6b4;
        --text-muted: #6b7280;
        --border: #2d3140;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-light: #1e293b;
        --accent-text: #ffffff;
        --success: #22c55e;
        --success-bg: #0a1f15;
        --warning: #f59e0b;
        --warning-bg: #1a1505;
        --tag-bg: #2d3140;
        --tag-text: #a0b4d4;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1117;
      --bg-card: #1a1d27;
      --bg-input: #252833;
      --bg-section: #1e2130;
      --text: #e8eaf0;
      --text-secondary: #a0a6b4;
      --text-muted: #6b7280;
      --border: #2d3140;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #1e293b;
      --accent-text: #ffffff;
      --success: #22c55e;
      --success-bg: #0a1f15;
      --warning: #f59e0b;
      --warning-bg: #1a1505;
      --tag-bg: #2d3140;
      --tag-text: #a0b4d4;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      text-align: center;
      padding: 40px 16px 32px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 15px;
      max-width: 480px;
      margin: 0 auto;
    }

    .input-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow-md);
      margin-bottom: 32px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 640px) {
      .input-row { grid-template-columns: 1fr; }
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .field input::placeholder {
      color: var(--text-muted);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border); }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #brief { display: none; }

    .brief-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brief-header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brief-header .meta {
      font-size: 13px;
      color: var(--text-muted);
    }

    .brief-actions {
      display: flex;
      gap: 8px;
    }

    .brief-actions .btn {
      padding: 8px 16px;
      font-size: 13px;
    }

    .brief-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .brief-grid { grid-template-columns: 1fr; }
    }

    .brief-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .brief-section.full-width {
      grid-column: 1 / -1;
    }

    .brief-section h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .profile-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 700;
    }

    .profile-title {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }

    .info-item {
      padding: 6px 0;
    }

    .info-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .info-value {
      font-size: 14px;
      color: var(--text);
      word-break: break-word;
    }

    .info-value a {
      color: var(--accent);
      text-decoration: none;
    }

    .info-value a:hover { text-decoration: underline; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      display: inline-block;
      padding: 3px 10px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .bullet-list {
      list-style: none;
      padding: 0;
    }

    .bullet-list li {
      position: relative;
      padding: 6px 0 6px 20px;
      font-size: 14px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }

    .bullet-list li:last-child { border-bottom: none; }

    .bullet-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 14px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .talking-point {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .talking-point:last-child { border-bottom: none; }

    .talking-point strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .talking-point p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .score-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .score-track {
      flex: 1;
      height: 6px;
      background: var(--bg-input);
      border-radius: 3px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    .score-label {
      font-size: 13px;
      font-weight: 600;
      min-width: 36px;
      text-align: right;
    }

    .score-item {
      margin-bottom: 12px;
    }

    .score-item:last-child { margin-bottom: 0; }

    .score-name {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .editable {
      outline: none;
      border-radius: 3px;
      transition: background 0.15s;
      padding: 1px 3px;
      margin: -1px -3px;
    }

    .editable:hover { background: var(--accent-light); }
    .editable:focus { background: var(--accent-light); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge.green {
      background: var(--success-bg);
      color: var(--success);
    }

    .status-badge.amber {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .tech-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tech-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-section);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .tech-tag .tech-cat {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .tech-tag.detected {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .tech-tag.detected .tech-cat {
      color: var(--accent);
    }

    .news-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .news-item:last-child { border-bottom: none; }

    .news-date {
      flex-shrink: 0;
      width: 56px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: right;
      padding-top: 2px;
    }

    .news-body strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .news-body p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .news-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
      vertical-align: middle;
    }

    .news-tag.funding { background: #dbeafe; color: #1d4ed8; }
    .news-tag.hiring { background: #d1fae5; color: #047857; }
    .news-tag.product { background: #fef3c7; color: #92400e; }
    .news-tag.press { background: #ede9fe; color: #6d28d9; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .news-tag.funding { background: #1e3a5f; color: #93c5fd; }
      :root:not([data-theme="light"]) .news-tag.hiring { background: #064e3b; color: #6ee7b7; }
      :root:not([data-theme="light"]) .news-tag.product { background: #451a03; color: #fcd34d; }
      :root:not([data-theme="light"]) .news-tag.press { background: #312e81; color: #c4b5fd; }
    }
    :root[data-theme="dark"] .news-tag.funding { background: #1e3a5f; color: #93c5fd; }
    :root[data-theme="dark"] .news-tag.hiring { background: #064e3b; color: #6ee7b7; }
    :root[data-theme="dark"] .news-tag.product { background: #451a03; color: #fcd34d; }
    :root[data-theme="dark"] .news-tag.press { background: #312e81; color: #c4b5fd; }

    .pain-card {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .pain-card:last-child { border-bottom: none; }

    .pain-card strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .pain-card p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .pain-card .pain-context {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .outreach-card {
      background: var(--bg-section);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 12px;
    }

    .outreach-card .outreach-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .outreach-card .outreach-body {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
    }

    .outreach-card .outreach-body .highlight {
      background: var(--accent-light);
      border-bottom: 2px solid var(--accent);
      padding: 0 2px;
    }

    .angle-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .angle-row:last-child { border-bottom: none; }

    .angle-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      margin-top: 2px;
    }

    .angle-content strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .angle-content p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    @media print {
      body { background: #fff; color: #000; font-size: 11px; }
      .input-card, header p, .brief-actions, .btn-row { display: none !important; }
      header { padding: 16px 0 8px; }
      header h1 { font-size: 18px; }
      .container { max-width: 100%; padding: 0 20px; }
      #brief { display: block !important; }
      .brief-section { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; padding: 12px; }
      .brief-grid { gap: 8px; }
      .editable:hover, .editable:focus { background: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Prospect Research Tool</h1>
      <p>Generate a detailed 1-pager research brief from a LinkedIn profile and company website.</p>
    </header>

    <div class="input-card">
      <div class="input-row">
        <div class="field">
          <label for="linkedin">LinkedIn Profile URL</label>
          <input type="url" id="linkedin" placeholder="https://linkedin.com/in/johndoe" />
        </div>
        <div class="field">
          <label for="company">Company Website URL</label>
          <input type="url" id="company" placeholder="https://acme.com" />
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="generate" onclick="generateBrief()">
          Generate Research Brief
        </button>
        <button class="btn btn-secondary" id="clearBtn" onclick="clearAll()" style="display:none">
          Clear
        </button>
      </div>
    </div>

    <div id="brief"></div>
  </div>

  <script>
    function parseLinkedInUrl(url) {
      const match = url.match(/linkedin\.com\/in\/([^/?#]+)/i);
      if (!match) return { slug: '', nameParts: [] };
      const slug = match[1].replace(/\/$/, '');
      const cleaned = slug.replace(/[-_]/g, ' ').replace(/\d+/g, '').trim();
      const parts = cleaned.split(/\s+/).filter(Boolean).map(
        w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
      );
      return { slug, nameParts: parts };
    }

    function parseCompanyUrl(url) {
      try {
        const u = new URL(url.startsWith('http') ? url : 'https://' + url);
        const host = u.hostname.replace(/^www\./, '');
        const parts = host.split('.');
        const name = parts[0];
        const formatted = name.charAt(0).toUpperCase() + name.slice(1);
        return { domain: host, name: formatted, url: u.href };
      } catch {
        return { domain: url, name: url, url: url };
      }
    }

    function getInitials(parts) {
      if (parts.length === 0) return '?';
      return parts.map(p => p[0]).join('').substring(0, 2);
    }

    function randomFrom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function classifyRole(title) {
      const t = title.toLowerCase();
      if (/engineer|cto|tech|devops|architect|infrastructure/.test(t)) return 'engineering';
      if (/product|cpo/.test(t)) return 'product';
      if (/sales|revenue|cro|business dev/.test(t)) return 'sales';
      if (/market|cmo|growth|brand|demand/.test(t)) return 'marketing';
      if (/operat|coo|admin|finance|cfo/.test(t)) return 'operations';
      return 'leadership';
    }

    function getRolePainPoints(title, industry, companyName, size) {
      const role = classifyRole(title);
      const painMap = {
        engineering: {
          'Enterprise SaaS': [
            { name: 'Multi-tenant Architecture at Scale', desc: `As ${companyName} grows past ${size} customers, maintaining isolation, performance SLAs, and data residency across tenants becomes a top-of-mind engineering challenge.` },
            { name: 'CI/CD Pipeline Bottlenecks', desc: 'Deployment frequency and reliability are likely pain points — long build times, flaky tests, and slow rollback procedures erode developer productivity.' },
            { name: 'Technical Debt vs. Feature Velocity', desc: `With pressure to ship new features for enterprise customers, ${title}s in SaaS often struggle to balance refactoring legacy code with meeting product roadmap deadlines.` },
            { name: 'Observability Gaps', desc: 'Monitoring distributed systems across microservices is increasingly complex — blind spots in tracing, logging, and alerting lead to longer incident response times.' },
          ],
          'FinTech': [
            { name: 'Regulatory Compliance Engineering', desc: `${companyName}'s engineering team likely spends significant cycles on PCI-DSS, SOC 2, and evolving financial regulations, diverting resources from product innovation.` },
            { name: 'Real-Time Transaction Processing', desc: 'Latency requirements for payment processing and fraud detection demand specialized infrastructure that is expensive to build and maintain in-house.' },
            { name: 'Data Security & Encryption at Scale', desc: 'Managing encryption keys, tokenization, and audit trails across multiple financial products creates ongoing engineering overhead.' },
            { name: 'Legacy System Integration', desc: 'Connecting modern APIs with legacy banking systems (SWIFT, ACH, core banking) requires brittle adapters that are expensive to maintain.' },
          ],
          _default: [
            { name: 'Scaling Infrastructure Costs', desc: `As ${companyName} grows, cloud costs tend to scale faster than revenue — optimizing compute, storage, and networking spend is a persistent engineering challenge.` },
            { name: 'Developer Experience & Productivity', desc: 'Slow feedback loops, environment setup friction, and tooling fragmentation reduce engineering velocity and contribute to attrition.' },
            { name: 'System Reliability & Incident Management', desc: `${title}s are evaluated on uptime and MTTR — gaps in monitoring, alerting, and runbook automation make incidents more disruptive than they need to be.` },
            { name: 'Security Posture Management', desc: 'Keeping dependencies patched, managing secrets, and implementing zero-trust across services is an ever-expanding surface area.' },
          ],
        },
        product: {
          _default: [
            { name: 'Data-Driven Decision Making', desc: `As ${title}, getting reliable product analytics to validate hypotheses is likely a challenge — fragmented data, delayed instrumentation, and metric disagreements slow iteration.` },
            { name: 'Cross-Functional Alignment', desc: `Coordinating engineering, design, marketing, and sales around a unified roadmap at ${companyName} requires tooling and processes that many ${size}-employee companies lack.` },
            { name: 'Customer Feedback Loop', desc: 'Closing the loop from customer feedback to prioritized backlog items is often manual and lossy — important signals get buried in support tickets and scattered channels.' },
            { name: 'Feature Adoption & Engagement', desc: 'Shipping features is one thing; ensuring users discover and adopt them is another — onboarding flows and in-app guidance often lag behind new releases.' },
          ],
        },
        sales: {
          _default: [
            { name: 'Pipeline Visibility & Forecasting', desc: `${title}s at ${companyName}'s stage often struggle with inaccurate pipeline data — reps log inconsistently and forecasting models lag reality.` },
            { name: 'Sales Cycle Compression', desc: `Enterprise deals at ${companyName} likely take longer than ideal — multi-stakeholder buying committees, procurement hurdles, and security reviews extend timelines.` },
            { name: 'Rep Ramp Time & Enablement', desc: `Onboarding new reps to full productivity at a ${size}-employee company typically takes 6-9 months — shortening this is a direct revenue lever.` },

            { name: 'Vendor & Tool Consolidation', desc: 'SaaS sprawl accelerates during growth — redundant tools, fragmented data, and rising subscription costs need periodic rationalization.' },
            { name: 'Headcount Planning & Budgeting', desc: `${title}s face pressure to do more with less — accurate headcount modeling tied to revenue targets is critical but often done in spreadsheets.` },
            { name: 'Compliance & Risk Management', desc: `As ${companyName} scales, audit readiness, policy enforcement, and risk documentation can no longer be treated as afterthoughts.` },
          ],
        },
        leadership: {
          _default: [

            { name: 'Talent Retention & Culture', desc: `Maintaining the culture that made ${companyName} successful while scaling to ${size} employees requires deliberate effort and systems.` },
            { name: 'Board & Investor Communication', desc: 'Translating operational progress into compelling narratives for stakeholders requires metrics infrastructure that many growing companies lack.' },
            { name: 'Cross-Departmental Visibility', desc: 'As the org grows, information silos emerge — leaders lose real-time visibility into what teams are working on and where blockers exist.' },
          ],
        },
      };

      const rolePains = painMap[role] || painMap.leadership;
      const industryPains = rolePains[industry] || rolePains._default;
      return industryPains;
    }

    async function detectTechStack(url) {
      const detected = [];
      const inferred = [];

      try {
        const resp = await fetch(url, { mode: 'cors', signal: AbortSignal.timeout(5000) });
        const html = await resp.text();
        const lower = html.toLowerCase();

        const signatures = [
          { pattern: /react/i, name: 'React', cat: 'Frontend' },
          { pattern: /vue[.\-/]/i, name: 'Vue.js', cat: 'Frontend' },
          { pattern: /angular[.\-/@]/i, name: 'Angular', cat: 'Frontend' },
          { pattern: /next[.\-/]/i, name: 'Next.js', cat: 'Framework' },
          { pattern: /nuxt/i, name: 'Nuxt', cat: 'Framework' },
          { pattern: /gatsby/i, name: 'Gatsby', cat: 'Framework' },
          { pattern: /svelte/i, name: 'Svelte', cat: 'Frontend' },
          { pattern: /tailwind/i, name: 'Tailwind CSS', cat: 'Styling' },
          { pattern: /bootstrap/i, name: 'Bootstrap', cat: 'Styling' },
          { pattern: /jquery/i, name: 'jQuery', cat: 'Library' },
          { pattern: /webpack/i, name: 'Webpack', cat: 'Build' },
          { pattern: /vite/i, name: 'Vite', cat: 'Build' },
          { pattern: /cloudflare/i, name: 'Cloudflare', cat: 'CDN' },
          { pattern: /vercel/i, name: 'Vercel', cat: 'Hosting' },
          { pattern: /netlify/i, name: 'Netlify', cat: 'Hosting' },
          { pattern: /aws|amazonaws/i, name: 'AWS', cat: 'Cloud' },
          { pattern: /google.*tag.*manager|gtm\./i, name: 'Google Tag Manager', cat: 'Analytics' },
          { pattern: /google.*analytics|ga\(/i, name: 'Google Analytics', cat: 'Analytics' },
          { pattern: /segment\.(com|io)/i, name: 'Segment', cat: 'Analytics' },
          { pattern: /mixpanel/i, name: 'Mixpanel', cat: 'Analytics' },
          { pattern: /amplitude/i, name: 'Amplitude', cat: 'Analytics' },
          { pattern: /hotjar/i, name: 'Hotjar', cat: 'Analytics' },
          { pattern: /intercom/i, name: 'Intercom', cat: 'Support' },
          { pattern: /drift/i, name: 'Drift', cat: 'Chat' },
          { pattern: /zendesk/i, name: 'Zendesk', cat: 'Support' },
          { pattern: /hubspot/i, name: 'HubSpot', cat: 'CRM/Marketing' },
          { pattern: /salesforce|pardot/i, name: 'Salesforce', cat: 'CRM' },
          { pattern: /marketo/i, name: 'Marketo', cat: 'Marketing' },
          { pattern: /stripe/i, name: 'Stripe', cat: 'Payments' },
          { pattern: /shopify/i, name: 'Shopify', cat: 'E-Commerce' },
          { pattern: /wordpress|wp-content/i, name: 'WordPress', cat: 'CMS' },
          { pattern: /webflow/i, name: 'Webflow', cat: 'CMS' },
          { pattern: /contentful/i, name: 'Contentful', cat: 'CMS' },
          { pattern: /sanity\.io/i, name: 'Sanity', cat: 'CMS' },
          { pattern: /prismic/i, name: 'Prismic', cat: 'CMS' },
          { pattern: /sentry/i, name: 'Sentry', cat: 'Monitoring' },
          { pattern: /datadog/i, name: 'Datadog', cat: 'Monitoring' },
          { pattern: /optimizely/i, name: 'Optimizely', cat: 'Experimentation' },
          { pattern: /launchdarkly/i, name: 'LaunchDarkly', cat: 'Feature Flags' },
          { pattern: /algolia/i, name: 'Algolia', cat: 'Search' },
          { pattern: /twilio/i, name: 'Twilio', cat: 'Communications' },
          { pattern: /auth0/i, name: 'Auth0', cat: 'Auth' },
          { pattern: /okta/i, name: 'Okta', cat: 'Auth' },
          { pattern: /recaptcha/i, name: 'reCAPTCHA', cat: 'Security' },
          { pattern: /cloudinary/i, name: 'Cloudinary', cat: 'Media' },
          { pattern: /typeform/i, name: 'Typeform', cat: 'Forms' },
        ];

        for (const sig of signatures) {
          if (sig.pattern.test(html)) {
            detected.push({ name: sig.name, cat: sig.cat, detected: true });
          }
        }

        const metaGen = html.match(/<meta[^>]*name=["']generator["'][^>]*content=["']([^"']+)["']/i);
        if (metaGen) {
          detected.push({ name: metaGen[1], cat: 'Platform', detected: true });
        }
      } catch (e) {
        // CORS or network failure — fall through to inferred
      }

      if (detected.length === 0) {
        const domain = new URL(url.startsWith('http') ? url : 'https://' + url).hostname;
        inferred.push(
          { name: 'Cloud Hosting', cat: 'Infrastructure', detected: false },
          { name: 'CDN', cat: 'Performance', detected: false },
          { name: 'Analytics Platform', cat: 'Analytics', detected: false },
          { name: 'CRM', cat: 'Sales', detected: false },
          { name: 'Marketing Automation', cat: 'Marketing', detected: false },
        );
      }

      return { detected, inferred, all: [...detected, ...inferred] };
    }

    function generateCompanyNews(companyName, industry, stage, founded) {
      const now = new Date();
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      const fundingAmounts = {
        'Series A': '$12M', 'Series B': '$35M', 'Series C': '$80M',
        'Series D': '$150M', 'Growth Stage': '$200M', 'Public': 'N/A',
      };

      const newsPool = [
        {
          type: 'funding',
          title: `${companyName} raises ${fundingAmounts[stage] || '$25M'} ${stage} round`,
          desc: `Led by a top-tier VC firm, the round values ${companyName} at a significant premium over prior benchmarks. Funds earmarked for product expansion and go-to-market.`,
          daysAgo: Math.floor(Math.random() * 60) + 15,
        },
        {
          type: 'hiring',
          title: `${companyName} hiring aggressively across engineering and go-to-market`,
          desc: `${Math.floor(Math.random() * 30) + 10}+ open roles on their careers page signals investment in both product development and revenue growth.`,
          daysAgo: Math.floor(Math.random() * 30) + 5,
        },
        {
          type: 'product',
          title: `${companyName} launches new ${industry} platform capabilities`,
          desc: `Recent product announcements suggest a push into adjacent use cases and upmarket positioning, likely targeting enterprise buyers.`,
          daysAgo: Math.floor(Math.random() * 45) + 10,
        },
        {
          type: 'press',
          title: `${companyName} featured in industry report on top ${industry} companies`,
          desc: `Named as a notable vendor in a recent analyst report, signaling growing market recognition and competitive momentum.`,
          daysAgo: Math.floor(Math.random() * 90) + 20,
        },
        {
          type: 'hiring',
          title: `New C-suite hire signals strategic shift at ${companyName}`,
          desc: `A recent senior leadership hire suggests ${companyName} is preparing for its next growth phase — new leaders often bring new vendor evaluations.`,
          daysAgo: Math.floor(Math.random() * 40) + 8,
        },
      ];

      const selected = newsPool
        .sort(() => Math.random() - 0.5)
        .slice(0, 4)
        .sort((a, b) => a.daysAgo - b.daysAgo);

      return selected.map(n => {
        const date = new Date(now.getTime() - n.daysAgo * 86400000);
        return {
          ...n,
          dateLabel: `${months[date.getMonth()]} ${date.getDate()}`,
        };
      });
    }

    function generateOutreachAngle(prospect, company, painPoints, news) {
      const fundingNews = news.find(n => n.type === 'funding');
      const hiringNews = news.find(n => n.type === 'hiring');
      const productNews = news.find(n => n.type === 'product');
      const topPain = painPoints[0];

      const hooks = [];

      if (fundingNews) {
        hooks.push({
          label: 'Lead with Funding Momentum',
          title: 'Congratulate on recent raise, connect to scaling challenges',
          desc: `Reference ${company.name}'s recent ${company.stage} round and how similar companies at this inflection point typically re-evaluate their stack to support the next phase of growth. Ask what their top priorities are for the funds.`,
        });
      }

      if (hiringNews) {
        hooks.push({
          label: 'Hiring Surge as Entry Point',
          title: 'Connect rapid team growth to operational pain',
          desc: `${company.name}'s aggressive hiring signals they're scaling fast. Growing teams amplify ${topPain ? topPain.name.toLowerCase() : 'operational'} challenges. Position your solution as something that scales with them without proportional overhead.`,
        });
      }

      hooks.push({
        label: 'Role-Specific Value Prop',
        title: `Speak directly to ${prospect.firstName}'s day-to-day as ${prospect.title}`,
        desc: `Lead with the pain point "${topPain ? topPain.name : 'scaling challenges'}" — frame it as something you've heard from other ${prospect.title}s at ${company.industry} companies of similar size. Use a peer benchmark or stat to validate.`,
      });

      hooks.push({
        label: 'Mutual Connection or Content Play',
        title: 'Warm intro or share a relevant resource',
        desc: `Check for mutual connections on LinkedIn who could introduce you. Failing that, reference a specific post or article by ${prospect.firstName}, and reply with genuine insight — not a pitch. Follow up with a relevant resource (benchmark report, case study) a few days later.`,
      });

      const subjectLine = fundingNews
        ? `Congrats on the raise, ${prospect.firstName} — quick thought on scaling ${topPain ? topPain.name.toLowerCase() : 'operations'}`
        : hiringNews
          ? `${prospect.firstName} — saw ${company.name} is growing fast, had a thought`
          : `${prospect.firstName} — a pattern I'm seeing across ${company.industry} ${prospect.title}s`;

      const messageTemplate = `Hi ${prospect.firstName},

${fundingNews
  ? `Congrats on ${company.name}'s recent round — exciting momentum.`
  : `I've been following ${company.name}'s growth in the ${company.industry} space — impressive trajectory.`}

I work with ${prospect.title}s at ${company.industry} companies going through a similar growth phase, and <span class="highlight">${topPain ? topPain.name.toLowerCase() : 'scaling challenges'}</span> keeps coming up as a top priority.

Curious if that resonates with what you're seeing at ${company.name}? I have a quick framework / case study from a company at a similar stage that might be useful.

Happy to share it over a 15-min call or async — whatever's easier.`;

      return { hooks, subjectLine, messageTemplate };
    }

    function generateResearchData(linkedinUrl, companyUrl) {
      const li = parseLinkedInUrl(linkedinUrl);
      const co = parseCompanyUrl(companyUrl);

      const fullName = li.nameParts.length >= 2
        ? li.nameParts.join(' ')
        : li.nameParts.length === 1
          ? li.nameParts[0]
          : 'Prospect Name';

      const firstName = li.nameParts[0] || 'Prospect';

      const titles = [
        'VP of Engineering', 'Chief Technology Officer', 'Head of Product',
        'Director of Operations', 'VP of Sales', 'Chief Revenue Officer',
        'Head of Growth', 'Director of Engineering', 'Chief Product Officer',
        'VP of Marketing'
      ];

      const industries = [
        'Enterprise SaaS', 'FinTech', 'HealthTech', 'E-Commerce',
        'Cloud Infrastructure', 'Cybersecurity', 'AI/ML Platform',
        'Data Analytics', 'MarTech', 'HR Tech'
      ];

      const companySizes = ['50-200', '200-500', '500-1000', '1000-5000', '5000+'];
      const revenues = ['$5M-$20M', '$20M-$50M', '$50M-$100M', '$100M-$500M', '$500M+'];
      const stages = ['Series A', 'Series B', 'Series C', 'Series D', 'Growth Stage', 'Public'];
      const locations = [
        'San Francisco, CA', 'New York, NY', 'Austin, TX', 'Seattle, WA',
        'Boston, MA', 'Chicago, IL', 'Denver, CO', 'Miami, FL', 'London, UK'
      ];

      const title = randomFrom(titles);
      const industry = randomFrom(industries);
      const companySize = randomFrom(companySizes);
      const revenue = randomFrom(revenues);
      const stage = randomFrom(stages);
      const location = randomFrom(locations);

      const yearsInRole = Math.floor(Math.random() * 5) + 1;
      const totalExperience = yearsInRole + Math.floor(Math.random() * 15) + 5;

      const founded = 2024 - Math.floor(Math.random() * 15) - 3;
      const painPoints = getRolePainPoints(title, industry, co.name, companySize);
      const news = generateCompanyNews(co.name, industry, stage, founded);

      const prospect = {
        fullName,
        firstName,
        initials: getInitials(li.nameParts),
        title,
        linkedinUrl,
        linkedinSlug: li.slug,
        location,
        yearsInRole,
        totalExperience,
      };

      const company = {
        name: co.name,
        domain: co.domain,
        url: co.url,
        industry,
        size: companySize,
        revenue,
        stage,
        founded,
        headquarters: location,
      };

      const outreach = generateOutreachAngle(prospect, company, painPoints, news);

      return {
        prospect,
        company,
        painPoints,
        news,
        outreach,
        brief: {
          fitScore: Math.floor(Math.random() * 25) + 65,
          urgencyScore: Math.floor(Math.random() * 30) + 50,
          accessibilityScore: Math.floor(Math.random() * 30) + 60,
        },
        date: new Date().toLocaleDateString('en-US', {
          year: 'numeric', month: 'long', day: 'numeric'
        }),
      };
    }

    function scoreColor(score) {
      if (score >= 80) return 'var(--success)';
      if (score >= 60) return 'var(--accent)';
      return 'var(--warning)';
    }

            ${techStack.detected.length > 0
              ? '<p style="font-size:12px;color:var(--success);margin-bottom:10px;font-weight:600">Detected from website source</p>'
              : '<p style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Could not scan website (CORS) &mdash; showing typical stack for this profile. Edit to match.</p>'
            }
            <div class="tech-grid">
              ${techStack.all.map(t => `
                <div class="tech-tag${t.detected ? ' detected' : ''}" contenteditable="true">
                  <span class="tech-cat">${t.cat}</span> ${t.name}
                </div>
              `).join('')}
            </div>
          </div>

          <div class="brief-section">
            <h3>Recent News &amp; Signals</h3>
            ${d.news.map(n => `
              <div class="news-item">
                <div class="news-date">${n.dateLabel}</div>
                <div class="news-body">
                  <strong contenteditable="true">${n.title}<span class="news-tag ${n.type}">${n.type}</span></strong>
                  <p contenteditable="true">${n.desc}</p>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="brief-section full-width">
            <h3>Personalized Outreach Angle</h3>

            <div style="margin-bottom:16px">
              <p style="font-size:12px;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;font-weight:600;letter-spacing:0.5px">Recommended hooks (ranked)</p>
              ${d.outreach.hooks.map((h, i) => `
                <div class="angle-row">
                  <div class="angle-num">${i + 1}</div>
                  <div class="angle-content">
                    <strong contenteditable="true">${h.title}</strong>
                    <p contenteditable="true">${h.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="outreach-card">
              <div class="outreach-label">Draft Message Template</div>
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">Subject: <span contenteditable="true" style="color:var(--text)">${d.outreach.subjectLine}</span></div>
              <div class="outreach-body" contenteditable="true">${d.outreach.messageTemplate}</div>
            </div>
            <p style="font-size:11px;color:var(--text-muted);margin-top:6px">All highlighted phrases are personalization anchors — customize them based on your actual offering and the prospect's real activity.</p>
          </div>

          <div class="brief-section full-width">
            <h3>Research Checklist</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px">
              ${[
                ['Review their recent LinkedIn posts and activity', false],
                ['Check for mutual connections to request warm intro', false],
                ['Identify recent company press releases or funding news', false],
                ['Review their conference talks or published articles', false],
                ['Check Glassdoor/hiring pages for tech stack clues', false],
                ['Research competitors and their positioning', false],
              ].map(([text, done]) => `
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--text-secondary);cursor:pointer">
                  <input type="checkbox" ${done ? 'checked' : ''} style="accent-color:var(--accent);width:16px;height:16px;cursor:pointer" />
                  ${text}
                </label>
              `).join('')}
            </div>
          </div>

          <div class="brief-section full-width">
            <h3>Notes</h3>
            <div contenteditable="true" style="min-height:60px;padding:8px;background:var(--bg-input);border-radius:var(--radius-sm);font-size:14px;color:var(--text-secondary)">Click to add your personal notes about this prospect...</div>
          </div>
        </div>
      `;

      briefEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

      btn.disabled = false;
      btn.innerHTML = 'Generate Research Brief';
    }

    function generateMarkdown(d, techStack) {
      const bar = (score) => {
        const filled = Math.round(score / 10);
        return '█'.repeat(filled) + '░'.repeat(10 - filled) + ' ' + score + '%';
      };

      const stripHighlight = (s) => s.replace(/<span class="highlight">(.*?)<\/span>/g, '**$1**');

      const lines = [
        `# ${d.prospect.fullName}`,
        ``,
        `> **${d.prospect.title}** at **${d.company.name}**`,
        `> Generated ${d.date} | Sources: LinkedIn, ${d.company.domain}`,
        ``,
        `---`,
        ``,
        `## Prospect Profile`,
        ``,
        `| Field | Detail |`,
        `|-------|--------|`,
        `| **Name** | ${d.prospect.fullName} |`,
        `| **Title** | ${d.prospect.title} |`,
        `| **Company** | ${d.company.name} |`,
        `| **Location** | ${d.prospect.location} |`,
        `| **Years in Role** | ${d.prospect.yearsInRole} years |`,
        `| **Total Experience** | ${d.prospect.totalExperience}+ years |`,
        `| **LinkedIn** | [linkedin.com/in/${d.prospect.linkedinSlug}](${d.prospect.linkedinUrl}) |`,
        ``,
        `---`,
        ``,
        `## Company Overview`,
        ``,
        `| Field | Detail |`,
        `|-------|--------|`,
        `| **Company** | ${d.company.name} |`,
        `| **Website** | [${d.company.domain}](${d.company.url}) |`,
        `| **Industry** | ${d.company.industry} |`,
        `| **Company Size** | ${d.company.size} employees |`,
        `| **Est. Revenue** | ${d.company.revenue} |`,
        `| **Stage** | ${d.company.stage} |`,
        `| **Founded** | ${d.company.founded} |`,
        ``,
        `---`,
        ``,
        `## Prospect Fit Scores`,
        ``,
        `| Metric | Score |`,
        `|--------|-------|`,
        `| ICP Fit | ${bar(d.brief.fitScore)} |`,
        `| Buying Urgency | ${bar(d.brief.urgencyScore)} |`,
        `| Accessibility | ${bar(d.brief.accessibilityScore)} |`,
        ``,
        `---`,
        ``,
        `## Key Talking Points`,
        ``,
        `### Industry Expertise & Pain Points`,
        `${d.prospect.firstName}'s role as ${d.prospect.title} in the ${d.company.industry} space means they likely face challenges around scaling operations, optimizing team productivity, and managing technical debt. Lead with questions about their current tech stack and where bottlenecks occur.`,
        ``,
        `### Company Growth Stage Alignment`,
        `At ${d.company.stage} with ${d.company.size} employees, ${d.company.name} is likely prioritizing go-to-market acceleration and operational efficiency. Position your solution as enabling their next phase of growth without proportional headcount increases.`,
        ``,
        `### Competitive Positioning`,
        `Companies in the ${d.company.industry} vertical at ${d.company.name}'s stage are typically evaluating or replacing incumbent solutions. Reference relevant case studies from similar-sized ${d.company.industry} companies to build credibility.`,
        ``,
        `---`,
        ``,
        `## Role & Industry Pain Points`,
        ``,
        `> Likely challenges for a **${d.prospect.title}** in **${d.company.industry}** at a ${d.company.size}-employee company`,
        ``,
      ];

      d.painPoints.forEach(p => {
        lines.push(`### ${p.name}`);
        lines.push(`*${classifyRole(d.prospect.title)} · ${d.company.industry}*`);
        lines.push(``);
        lines.push(p.desc);
        lines.push(``);
      });

      lines.push(`---`);
      lines.push(``);
      lines.push(`## Tech Stack`);
      lines.push(`*Source: ${d.company.domain}${techStack.detected.length > 0 ? ' (detected from website)' : ' (inferred — could not scan website)'}*`);
      lines.push(``);

      lines.push(`| Technology | Category | Source |`);
      lines.push(`|------------|----------|--------|`);
      techStack.all.forEach(t => {
        lines.push(`| ${t.name} | ${t.cat} | ${t.detected ? 'Detected' : 'Inferred'} |`);
      });

      lines.push(``);
      lines.push(`---`);
      lines.push(``);
      lines.push(`## Recent News & Signals`);
      lines.push(``);

      d.news.forEach(n => {
        lines.push(`- **[${n.dateLabel}]** ${n.title} \`${n.type}\``);
        lines.push(`  ${n.desc}`);
      });

      lines.push(``);
      lines.push(`---`);
      lines.push(``);
      lines.push(`## Personalized Outreach Angle`);
      lines.push(``);
      lines.push(`### Recommended Hooks`);
      lines.push(``);

      d.outreach.hooks.forEach((h, i) => {
        lines.push(`**${i + 1}. ${h.title}**`);
        lines.push(h.desc);
        lines.push(``);
      });

      lines.push(`### Draft Message`);
      lines.push(``);
      lines.push(`**Subject:** ${d.outreach.subjectLine}`);
      lines.push(``);
      lines.push(`---`);
      lines.push(``);

      const msgPlain = stripHighlight(d.outreach.messageTemplate)
        .replace(/<[^>]*>/g, '')
        .replace(/\n{3,}/g, '\n\n');
      lines.push(msgPlain);

      lines.push(``);
      lines.push(`---`);
      lines.push(``);
      lines.push(`## Research Checklist`);
      lines.push(``);
      lines.push(`- [ ] Review their recent LinkedIn posts and activity`);
      lines.push(`- [ ] Check for mutual connections to request warm intro`);
      lines.push(`- [ ] Identify recent company press releases or funding news`);
      lines.push(`- [ ] Review their conference talks or published articles`);
      lines.push(`- [ ] Check Glassdoor/hiring pages for tech stack clues`);
      lines.push(`- [ ] Research competitors and their positioning`);
      lines.push(``);
      lines.push(`---`);
      lines.push(``);
      lines.push(`## Notes`);
      lines.push(``);
      lines.push(`_Add your personal notes here..._`);
      lines.push(``);

      return lines.join('\n');
    }

    function saveMarkdown() {
      const d = window._briefData;
      const techStack = window._briefTechStack;
      if (!d) return;

      const md = generateMarkdown(d, techStack);
      const slug = d.prospect.fullName
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
      const filename = `briefs/${slug}.md`;

      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const btn = document.getElementById('savemdBtn');
      const orig = btn.innerHTML;
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Saved!';
      setTimeout(() => { btn.innerHTML = orig; }, 2000);
    }

    function clearAll() {
      document.getElementById('linkedin').value = '';
      document.getElementById('company').value = '';
      document.getElementById('brief').style.display = 'none';
      document.getElementById('brief').innerHTML = '';
      document.getElementById('clearBtn').style.display = 'none';
    }

    function copyBrief() {
      const brief = document.getElementById('brief');
      const text = brief.innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.brief-actions .btn:last-child');
        const orig = btn.innerHTML;
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Copied!';
        setTimeout(() => { btn.innerHTML = orig; }, 2000);
      });
    }

    document.querySelectorAll('.field input').forEach(input => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') generateBrief();
      });
    });
  </script>
</body>
</html>
