<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospect Research Tool</title>
  <style>
    :root {
      --bg: #f8f9fb;
      --bg-card: #ffffff;
      --bg-input: #f1f3f7;
      --bg-section: #f8f9fb;
      --text: #1a1d23;
      --text-secondary: #5f6672;
      --text-muted: #8b919d;
      --border: #e2e5eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff4ff;
      --accent-text: #ffffff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --tag-bg: #e8edf5;
      --tag-text: #3b4a6b;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
      --radius: 10px;
      --radius-sm: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1117;
        --bg-card: #1a1d27;
        --bg-input: #252833;
        --bg-section: #1e2130;
        --text: #e8eaf0;
        --text-secondary: #a0a6b4;
        --text-muted: #6b7280;
        --border: #2d3140;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-light: #1e293b;
        --accent-text: #ffffff;
        --success: #22c55e;
        --success-bg: #0a1f15;
        --warning: #f59e0b;
        --warning-bg: #1a1505;
        --tag-bg: #2d3140;
        --tag-text: #a0b4d4;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1117;
      --bg-card: #1a1d27;
      --bg-input: #252833;
      --bg-section: #1e2130;
      --text: #e8eaf0;
      --text-secondary: #a0a6b4;
      --text-muted: #6b7280;
      --border: #2d3140;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #1e293b;
      --accent-text: #ffffff;
      --success: #22c55e;
      --success-bg: #0a1f15;
      --warning: #f59e0b;
      --warning-bg: #1a1505;
      --tag-bg: #2d3140;
      --tag-text: #a0b4d4;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      text-align: center;
      padding: 40px 16px 32px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 15px;
      max-width: 480px;
      margin: 0 auto;
    }

    .input-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow-md);
      margin-bottom: 32px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 640px) {
      .input-row { grid-template-columns: 1fr; }
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .field input::placeholder {
      color: var(--text-muted);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border); }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #brief { display: none; }

    .brief-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brief-header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brief-header .meta {
      font-size: 13px;
      color: var(--text-muted);
    }

    .brief-actions {
      display: flex;
      gap: 8px;
    }

    .brief-actions .btn {
      padding: 8px 16px;
      font-size: 13px;
    }

    .brief-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .brief-grid { grid-template-columns: 1fr; }
    }

    .brief-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .brief-section.full-width {
      grid-column: 1 / -1;
    }

    .brief-section h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .profile-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 700;
    }

    .profile-title {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }

    .info-item {
      padding: 6px 0;
    }

    .info-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .info-value {
      font-size: 14px;
      color: var(--text);
      word-break: break-word;
    }

    .info-value a {
      color: var(--accent);
      text-decoration: none;
    }

    .info-value a:hover { text-decoration: underline; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      display: inline-block;
      padding: 3px 10px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .bullet-list {
      list-style: none;
      padding: 0;
    }

    .bullet-list li {
      position: relative;
      padding: 6px 0 6px 20px;
      font-size: 14px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }

    .bullet-list li:last-child { border-bottom: none; }

    .bullet-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 14px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .talking-point {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .talking-point:last-child { border-bottom: none; }

    .talking-point strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .talking-point p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .score-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .score-track {
      flex: 1;
      height: 6px;
      background: var(--bg-input);
      border-radius: 3px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    .score-label {
      font-size: 13px;
      font-weight: 600;
      min-width: 36px;
      text-align: right;
    }

    .score-item {
      margin-bottom: 12px;
    }

    .score-item:last-child { margin-bottom: 0; }

    .score-name {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .editable {
      outline: none;
      border-radius: 3px;
      transition: background 0.15s;
      padding: 1px 3px;
      margin: -1px -3px;
    }

    .editable:hover { background: var(--accent-light); }
    .editable:focus { background: var(--accent-light); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge.green {
      background: var(--success-bg);
      color: var(--success);
    }

    .status-badge.amber {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    @media print {
      body { background: #fff; color: #000; font-size: 11px; }
      .input-card, header p, .brief-actions, .btn-row { display: none !important; }
      header { padding: 16px 0 8px; }
      header h1 { font-size: 18px; }
      .container { max-width: 100%; padding: 0 20px; }
      #brief { display: block !important; }
      .brief-section { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; padding: 12px; }
      .brief-grid { gap: 8px; }
      .editable:hover, .editable:focus { background: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Prospect Research Tool</h1>
      <p>Generate a detailed 1-pager research brief from a LinkedIn profile and company website.</p>
    </header>

    <div class="input-card">
      <div class="input-row">
        <div class="field">
          <label for="linkedin">LinkedIn Profile URL</label>
          <input type="url" id="linkedin" placeholder="https://linkedin.com/in/johndoe" />
        </div>
        <div class="field">
          <label for="company">Company Website URL</label>
          <input type="url" id="company" placeholder="https://acme.com" />
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="generate" onclick="generateBrief()">
          Generate Research Brief
        </button>
        <button class="btn btn-secondary" id="clearBtn" onclick="clearAll()" style="display:none">
          Clear
        </button>
      </div>
    </div>

    <div id="brief"></div>
  </div>

  <script>
    function parseLinkedInUrl(url) {
      const match = url.match(/linkedin\.com\/in\/([^/?#]+)/i);
      if (!match) return { slug: '', nameParts: [] };
      const slug = match[1].replace(/\/$/, '');
      const cleaned = slug.replace(/[-_]/g, ' ').replace(/\d+/g, '').trim();
      const parts = cleaned.split(/\s+/).filter(Boolean).map(
        w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
      );
      return { slug, nameParts: parts };
    }

    function parseCompanyUrl(url) {
      try {
        const u = new URL(url.startsWith('http') ? url : 'https://' + url);
        const host = u.hostname.replace(/^www\./, '');
        const parts = host.split('.');
        const name = parts[0];
        const formatted = name.charAt(0).toUpperCase() + name.slice(1);
        return { domain: host, name: formatted, url: u.href };
      } catch {
        return { domain: url, name: url, url: url };
      }
    }

    function getInitials(parts) {
      if (parts.length === 0) return '?';
      return parts.map(p => p[0]).join('').substring(0, 2);
    }

    function randomFrom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateResearchData(linkedinUrl, companyUrl) {
      const li = parseLinkedInUrl(linkedinUrl);
      const co = parseCompanyUrl(companyUrl);

      const fullName = li.nameParts.length >= 2
        ? li.nameParts.join(' ')
        : li.nameParts.length === 1
          ? li.nameParts[0]
          : 'Prospect Name';

      const firstName = li.nameParts[0] || 'Prospect';

      const titles = [
        'VP of Engineering', 'Chief Technology Officer', 'Head of Product',
        'Director of Operations', 'VP of Sales', 'Chief Revenue Officer',
        'Head of Growth', 'Director of Engineering', 'Chief Product Officer',
        'VP of Marketing'
      ];

      const industries = [
        'Enterprise SaaS', 'FinTech', 'HealthTech', 'E-Commerce',
        'Cloud Infrastructure', 'Cybersecurity', 'AI/ML Platform',
        'Data Analytics', 'MarTech', 'HR Tech'
      ];

      const companySizes = ['50-200', '200-500', '500-1000', '1000-5000', '5000+'];
      const revenues = ['$5M-$20M', '$20M-$50M', '$50M-$100M', '$100M-$500M', '$500M+'];
      const stages = ['Series A', 'Series B', 'Series C', 'Series D', 'Growth Stage', 'Public'];
      const locations = [
        'San Francisco, CA', 'New York, NY', 'Austin, TX', 'Seattle, WA',
        'Boston, MA', 'Chicago, IL', 'Denver, CO', 'Miami, FL', 'London, UK'
      ];

      const title = randomFrom(titles);
      const industry = randomFrom(industries);
      const companySize = randomFrom(companySizes);
      const revenue = randomFrom(revenues);
      const stage = randomFrom(stages);
      const location = randomFrom(locations);

      const yearsInRole = Math.floor(Math.random() * 5) + 1;
      const totalExperience = yearsInRole + Math.floor(Math.random() * 15) + 5;

      return {
        prospect: {
          fullName,
          firstName,
          initials: getInitials(li.nameParts),
          title,
          linkedinUrl,
          linkedinSlug: li.slug,
          location,
          yearsInRole,
          totalExperience,
        },
        company: {
          name: co.name,
          domain: co.domain,
          url: co.url,
          industry,
          size: companySize,
          revenue,
          stage,
          founded: 2024 - Math.floor(Math.random() * 15) - 3,
          headquarters: location,
        },
        brief: {
          fitScore: Math.floor(Math.random() * 25) + 65,
          urgencyScore: Math.floor(Math.random() * 30) + 50,
          accessibilityScore: Math.floor(Math.random() * 30) + 60,
        },
        date: new Date().toLocaleDateString('en-US', {
          year: 'numeric', month: 'long', day: 'numeric'
        }),
      };
    }

    function scoreColor(score) {
      if (score >= 80) return 'var(--success)';
      if (score >= 60) return 'var(--accent)';
      return 'var(--warning)';
    }

    async function generateBrief() {
      const linkedinUrl = document.getElementById('linkedin').value.trim();
      const companyUrl = document.getElementById('company').value.trim();

      if (!linkedinUrl || !companyUrl) {
        alert('Please enter both a LinkedIn profile URL and a company website URL.');
        return;
      }

      if (!linkedinUrl.includes('linkedin.com')) {
        alert('Please enter a valid LinkedIn URL (e.g., https://linkedin.com/in/username).');
        return;
      }

      const btn = document.getElementById('generate');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Researching...';

      await new Promise(r => setTimeout(r, 1500));

      const d = generateResearchData(linkedinUrl, companyUrl);

      const briefEl = document.getElementById('brief');
      briefEl.style.display = 'block';
      document.getElementById('clearBtn').style.display = '';

      briefEl.innerHTML = `
        <div class="brief-header">
          <div>
            <h2>Research Brief</h2>
            <div class="meta">Generated ${d.date} &middot; Sources: LinkedIn, ${d.company.domain}</div>
          </div>
          <div class="brief-actions">
            <button class="btn btn-secondary" onclick="window.print()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Print / PDF
            </button>
            <button class="btn btn-secondary" onclick="copyBrief()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copy
            </button>
          </div>
        </div>

        <div class="brief-grid">
          <div class="brief-section full-width">
            <h3>Prospect Profile</h3>
            <div class="profile-header">
              <div class="avatar">${d.prospect.initials}</div>
              <div>
                <div class="profile-name" contenteditable="true" class="editable">${d.prospect.fullName}</div>
                <div class="profile-title" contenteditable="true" class="editable">${d.prospect.title} at ${d.company.name}</div>
              </div>
              <div style="margin-left:auto">
                <span class="status-badge green"><span class="status-dot"></span>Active Profile</span>
              </div>
            </div>
            <div class="info-grid">
              <div class="info-item">
                <div class="info-label">Location</div>
                <div class="info-value editable" contenteditable="true">${d.prospect.location}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Years in Role</div>
                <div class="info-value editable" contenteditable="true">${d.prospect.yearsInRole} years</div>
              </div>
              <div class="info-item">
                <div class="info-label">LinkedIn</div>
                <div class="info-value"><a href="${d.prospect.linkedinUrl}" target="_blank">linkedin.com/in/${d.prospect.linkedinSlug}</a></div>
              </div>
              <div class="info-item">
                <div class="info-label">Total Experience</div>
                <div class="info-value editable" contenteditable="true">${d.prospect.totalExperience}+ years</div>
              </div>
            </div>
          </div>

          <div class="brief-section">
            <h3>Company Overview</h3>
            <div class="info-item">
              <div class="info-label">Company</div>
              <div class="info-value" style="font-weight:600;font-size:16px" contenteditable="true">${d.company.name}</div>
            </div>
            <div class="info-grid" style="margin-top:8px">
              <div class="info-item">
                <div class="info-label">Industry</div>
                <div class="info-value editable" contenteditable="true">${d.company.industry}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Company Size</div>
                <div class="info-value editable" contenteditable="true">${d.company.size} employees</div>
              </div>
              <div class="info-item">
                <div class="info-label">Est. Revenue</div>
                <div class="info-value editable" contenteditable="true">${d.company.revenue}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Stage</div>
                <div class="info-value editable" contenteditable="true">${d.company.stage}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Founded</div>
                <div class="info-value editable" contenteditable="true">${d.company.founded}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Website</div>
                <div class="info-value"><a href="${d.company.url}" target="_blank">${d.company.domain}</a></div>
              </div>
            </div>
          </div>

          <div class="brief-section">
            <h3>Prospect Fit Scores</h3>
            <div class="score-item">
              <div class="score-name">ICP Fit</div>
              <div class="score-bar">
                <div class="score-track">
                  <div class="score-fill" style="width:${d.brief.fitScore}%;background:${scoreColor(d.brief.fitScore)}"></div>
                </div>
                <div class="score-label" style="color:${scoreColor(d.brief.fitScore)}">${d.brief.fitScore}%</div>
              </div>
            </div>
            <div class="score-item">
              <div class="score-name">Buying Urgency</div>
              <div class="score-bar">
                <div class="score-track">
                  <div class="score-fill" style="width:${d.brief.urgencyScore}%;background:${scoreColor(d.brief.urgencyScore)}"></div>
                </div>
                <div class="score-label" style="color:${scoreColor(d.brief.urgencyScore)}">${d.brief.urgencyScore}%</div>
              </div>
            </div>
            <div class="score-item">
              <div class="score-name">Accessibility</div>
              <div class="score-bar">
                <div class="score-track">
                  <div class="score-fill" style="width:${d.brief.accessibilityScore}%;background:${scoreColor(d.brief.accessibilityScore)}"></div>
                </div>
                <div class="score-label" style="color:${scoreColor(d.brief.accessibilityScore)}">${d.brief.accessibilityScore}%</div>
              </div>
            </div>
          </div>

          <div class="brief-section full-width">
            <h3>Key Talking Points</h3>
            <div class="talking-point">
              <strong contenteditable="true">Industry Expertise & Pain Points</strong>
              <p contenteditable="true">${d.prospect.firstName}'s role as ${d.prospect.title} in the ${d.company.industry} space means they likely face challenges around scaling operations, optimizing team productivity, and managing technical debt. Lead with questions about their current tech stack and where bottlenecks occur.</p>
            </div>
            <div class="talking-point">
              <strong contenteditable="true">Company Growth Stage Alignment</strong>
              <p contenteditable="true">At ${d.company.stage} with ${d.company.size} employees, ${d.company.name} is likely prioritizing go-to-market acceleration and operational efficiency. Position your solution as enabling their next phase of growth without proportional headcount increases.</p>
            </div>
            <div class="talking-point">
              <strong contenteditable="true">Competitive Positioning</strong>
              <p contenteditable="true">Companies in the ${d.company.industry} vertical at ${d.company.name}'s stage are typically evaluating or replacing incumbent solutions. Reference relevant case studies from similar-sized ${d.company.industry} companies to build credibility.</p>
            </div>
          </div>

          <div class="brief-section">
            <h3>Potential Pain Points</h3>
            <ul class="bullet-list">
              <li contenteditable="true">Scaling infrastructure to support rapid customer growth</li>
              <li contenteditable="true">Reducing time-to-market for new product features</li>
              <li contenteditable="true">Improving cross-functional team collaboration and alignment</li>
              <li contenteditable="true">Managing compliance and security requirements at scale</li>
              <li contenteditable="true">Reducing customer acquisition cost while maintaining quality</li>
            </ul>
          </div>

          <div class="brief-section">
            <h3>Recommended Approach</h3>
            <ul class="bullet-list">
              <li contenteditable="true">Open with a personalized reference to ${d.prospect.firstName}'s background in ${d.company.industry}</li>
              <li contenteditable="true">Reference a recent company milestone or news from ${d.company.name}</li>
              <li contenteditable="true">Share a relevant case study from a peer company at a similar growth stage</li>
              <li contenteditable="true">Propose a short 15-minute discovery call focused on their current priorities</li>
              <li contenteditable="true">Follow up via LinkedIn with a value-add resource (article, benchmark data, etc.)</li>
            </ul>
          </div>

          <div class="brief-section full-width">
            <h3>Research Checklist</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px">
              ${[
                ['Review their recent LinkedIn posts and activity', false],
                ['Check for mutual connections to request warm intro', false],
                ['Identify recent company press releases or funding news', false],
                ['Review their conference talks or published articles', false],
                ['Check Glassdoor/hiring pages for tech stack clues', false],
                ['Research competitors and their positioning', false],
              ].map(([text, done]) => `
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--text-secondary);cursor:pointer">
                  <input type="checkbox" ${done ? 'checked' : ''} style="accent-color:var(--accent);width:16px;height:16px;cursor:pointer" />
                  ${text}
                </label>
              `).join('')}
            </div>
          </div>

          <div class="brief-section full-width">
            <h3>Notes</h3>
            <div contenteditable="true" style="min-height:60px;padding:8px;background:var(--bg-input);border-radius:var(--radius-sm);font-size:14px;color:var(--text-secondary)">Click to add your personal notes about this prospect...</div>
          </div>
        </div>
      `;

      briefEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

      btn.disabled = false;
      btn.innerHTML = 'Generate Research Brief';
    }

    function clearAll() {
      document.getElementById('linkedin').value = '';
      document.getElementById('company').value = '';
      document.getElementById('brief').style.display = 'none';
      document.getElementById('brief').innerHTML = '';
      document.getElementById('clearBtn').style.display = 'none';
    }

    function copyBrief() {
      const brief = document.getElementById('brief');
      const text = brief.innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.brief-actions .btn:last-child');
        const orig = btn.innerHTML;
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Copied!';
        setTimeout(() => { btn.innerHTML = orig; }, 2000);
      });
    }

    document.querySelectorAll('.field input').forEach(input => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') generateBrief();
      });
    });
  </script>
</body>
</html>
